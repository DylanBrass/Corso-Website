name: CI/CD Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  qodana-corso_website_springboot:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the project
        uses: actions/checkout@v3

      - name: Skip the backend scan
        id: skip-scan
        uses: fkirc/skip-duplicate-actions@master
        with:
          paths: '["corso_website_springboot/**"]'

      - name: Scan the project
        if: steps.skip-scan.outputs.should_skip != 'true'
        uses: JetBrains/qodana-action@v2022.2.2
        timeout-minutes: 20
        with:
          args: --project-dir,corso_website_springboot,--baseline,qodana.sarif.json
          results-dir: ${{ runner.temp }}/qodana/results-corso_website_springboot
          artifact-name: qodana-report-corso_website_springboot
          cache-dir: ${{ runner.temp }}/qodana/caches-corso_website_springboot
          additional-cache-hash: ${{ github.sha }}-corso_website_springboot
  
    
