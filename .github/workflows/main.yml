name: CI/CD Pipeline Gradle

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 'setup-chromedriver'
        uses: nanasess/setup-chromedriver@v2
        with:
          chromedriver-version: '88.0.4324.96' # Optional: do not specify to match Chrome's version
      - run: |
          export DISPLAY=:99
          chromedriver --url-base=/wd/hub &
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 & # optional

      - name: npm install, build, and test
        working-directory: corso_website_fe
        run: |
          npm ci
          npm run build --if-present
          npm start & npx wait-on http://127.0.0.1:3000
        env:
          CI: true

      - name: Print Current directory
        run: |
          pwd
          ls

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'gradle'

      - name: Print Current directory and list files
        run: |
          pwd
          ls

      - name: Run Gradle Build
        working-directory: corso_website_springboot
        run: ./gradlew build
