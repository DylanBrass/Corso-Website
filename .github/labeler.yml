# Add 'root' label to any root file changes
# Quotation marks are required for the leading asterisk
root:
- changed-files:
  - any-glob-to-any-file: '*'

# Add 'AnyChange' label to any changes within the entire repository
AnyChange:
- changed-files:
  - any-glob-to-any-file: '**'

# Add 'Documentation' label to any changes within 'docs' folder or any subfolders
Documentation:
- changed-files:
  - any-glob-to-any-file: docs/**

# Add 'Documentation' label to any file changes within 'docs' folder
Documentation:
- changed-files:
  - any-glob-to-any-file: docs/*

# Add 'Documentation' label to any file changes within 'docs' or 'guides' folders
Documentation:
- changed-files:
  - any-glob-to-any-file:
    - docs/*
    - guides/*


# Add 'Documentation' label to any change to .md files within the entire repository 
Documentation:
- changed-files:
  - any-glob-to-any-file: '**/*.md'

Documentation:
- changed-files:
  - any-glob-to-any-file: '**/*.puml'

  
Frontend:
-changed-files:
  - any-glob-to-any-file: ['**/*.tsx', '**/*.css','**/*.js','**/*.jsx', '**/*.html']


# Add 'source' label to any change to src files within the source dir EXCEPT for the docs sub-folder
source:
- all:
  - changed-files:
    - any-glob-to-any-file: 'src/**/*'
    - all-globs-to-all-files: '!src/docs/*'

# Add 'feature' label to any PR where the head branch name starts with `feature` or has a `feature` section in the name
feature:
 - head-branch: ['^feature', 'feature']

BugFix:
- title:
    contains: ['bug', 'fix']

Enhancement:
- title:
    contains: ['enhance', 'improve']

Backend:
- changed-files:
  - any-glob-to-any-file: ['src/main/java/**/*.java', 'src/main/resources/**']

Testing:
- changed-files:
  - any-glob-to-any-file: ['src/test/**', 'tests/**']

Database:
- changed-files:
  - any-glob-to-any-file: 'src/main/resources/db/**'

Security:
- changed-files:
  - any-glob-to-any-file: 'java/com/corso/springboot/configuration/security/**'

    
# Add 'release' label to any PR that is opened against the `main` branch
release:
 - base-branch: 'main'

