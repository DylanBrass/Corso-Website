frontend:
  - changed-files:
      - any-glob-to-any-file: corso_website_fe/**

backend:
  - changed-files:
      - any-glob-to-any-file: corso_website_springboot/**

Documentation:
  - changed-files:
      - any-glob-to-any-file: '**/*.puml'
  - head-branch: ['^doc', 'doc']

feature:
  - head-branch: ['^feat', 'feat']

bug:
  - head-branch: ['^bug', 'bug']

config:
  - changed-files:
      - any-glob-to-any-file: ['**/*.yml', '**/*.properties']

security:
  - changed-files:
      - any-glob-to-any-file: 'corso_website_springboot/src/main/java/com/corso/springboot/configuration/security/**'

tests:
  - changed-files:
      - any-glob-to-any-file: 'corso_website_springboot/src/test/**'
