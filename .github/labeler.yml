Documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - guides/**
  - changed-files:
      - any-glob-to-any-file: '**/*.md'
  - changed-files:
      - any-glob-to-any-file: '**/*.puml'
 
Frontend:
  - changed-files:
      - any-glob-to-any-file: ['**/*.tsx', '**/*.css', '**/*.js', '**/*.jsx', '**/*.html']

source:
  - all:
      - changed-files:
          - any-glob-to-any-file: 'src/**/*'
          - all-globs-to-all-files: '!src/docs/*'

feature:
  - head-branch: ['^feature', 'feature']

Backend:
  - changed-files:
      - any-glob-to-any-file: ['src/main/java/**/*.java', 'src/main/resources/**']

Testing:
  - changed-files:
      - any-glob-to-any-file: ['src/test/**', 'tests/**']

Database:
  - changed-files:
      - any-glob-to-any-file: 'src/main/resources/db/**'

Security:
  - changed-files:
      - any-glob-to-any-file: 'java/com/corso/springboot/configuration/security/**'

release:
  - base-branch: 'main'
