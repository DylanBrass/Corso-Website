frontend:
  - changed-files:
      - all-globs-to-all-files: corso_website_fe/**

backend:
  - changed-files:
      - all-globs-to-all-files: corso_website_springboot/**

Documentation:
  - changed-files:
      - all-globs-to-all-files: '**/*.puml'
  - head-branch: ['^doc', 'doc']

feature:
  - head-branch: ['^feat', 'feat']

bug:
  - head-branch: ['^bug', 'bug']

config:
  - changed-files:
      - all-globs-to-all-files: ['**/*.yml', '**/*.properties']

