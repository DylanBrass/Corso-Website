services:
    corso-backend:
      build: .
      hostname: corso-be
      ports:
        - "8080:8080"
      environment:
        - SPRING_PROFILES_ACTIVE=docker

        - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp-credentials
      secrets:
        - gcp-credentials

secrets:
  gcp-credentials:
    file: src/main/resources/gcp-credentials.json