# Default Spring Profile
server:
  error:
    include-message: always

logging:
  level:
    root: INFO
    com.dylan: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
---
# for test

# for h2
spring:
  config:
    activate:
      on-profile: test

  h2:
    console:
      enabled: true

  datasource:
    url: jdbc:h2:mem:corso-dev-db;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        globally_quoted_identifiers: true
        auto-quote-keyword: true
        format_sql: true

    defer-datasource-initialization: true
  sql:
    init:
      platform: h2
      mode: always

logging:
  level:
    org.springframework.data.jpa: DEBUG
    org.hibernate.SQL: DEBUG

---
