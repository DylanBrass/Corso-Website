# for h2
spring:
  config:
    activate:
      on-profile: test

  h2:
    console:
      enabled: true

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=100;DB_CLOSE_ON_EXIT=false;DATABASE_TO_UPPER=false;MODE=MySQL;
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
